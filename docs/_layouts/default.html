<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} – Kcal-Kun</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #FBF7F0;
            --card: #FFFFFF;
            --ink: #1A1A1A;
            --ink-secondary: rgba(26,26,26,0.6);
            --ink-tertiary: rgba(26,26,26,0.4);
            --terra: #D97757;
            --warm-brown: #7C5E3C;
            --beige: #E8DFD0;
            --divider: rgba(26,26,26,0.10);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 16px;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 60px 24px 80px;
        }
        header.site-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--divider);
            margin-bottom: 32px;
        }
        header.site-header .logo {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
        }
        header.site-header .brand {
            font-family: "Instrument Serif", Georgia, serif;
            font-size: 24px;
            color: var(--ink);
            line-height: 1;
        }
        header.site-header a {
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        article {
            background: var(--card);
            border-radius: 22px;
            padding: 40px 36px;
            box-shadow: 0 4px 28px rgba(124, 94, 60, 0.06);
        }
        article h1 {
            font-family: "Instrument Serif", Georgia, serif;
            font-weight: 400;
            font-size: 38px;
            line-height: 1.15;
            margin: 0 0 8px;
            color: var(--ink);
        }
        article h2 {
            font-family: "Instrument Serif", Georgia, serif;
            font-weight: 400;
            font-size: 26px;
            margin: 40px 0 12px;
            color: var(--ink);
        }
        article h3 {
            font-size: 17px;
            font-weight: 700;
            margin: 28px 0 8px;
            color: var(--ink);
            letter-spacing: -0.01em;
        }
        article p, article li {
            color: var(--ink);
        }
        article a {
            color: var(--terra);
            text-decoration: underline;
            text-decoration-thickness: 1px;
            text-underline-offset: 2px;
        }
        article a:hover {
            color: var(--warm-brown);
        }
        article strong {
            color: var(--ink);
        }
        article ul, article ol {
            padding-left: 22px;
            margin: 8px 0 16px;
        }
        article li {
            margin: 6px 0;
        }
        article hr {
            border: none;
            border-top: 1px solid var(--divider);
            margin: 36px 0;
        }
        article code {
            background: var(--beige);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.92em;
            font-family: "SF Mono", "Menlo", monospace;
        }
        article blockquote {
            border-left: 3px solid var(--terra);
            margin: 16px 0;
            padding: 8px 16px;
            background: rgba(217, 119, 87, 0.06);
            border-radius: 0 8px 8px 0;
            color: var(--ink);
        }
        article table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
            font-size: 14px;
        }
        article table th, article table td {
            text-align: left;
            padding: 10px 12px;
            border-bottom: 1px solid var(--divider);
        }
        article table th {
            background: var(--beige);
            font-weight: 600;
        }
        footer.site-footer {
            margin-top: 48px;
            padding-top: 24px;
            border-top: 1px solid var(--divider);
            text-align: center;
            font-size: 13px;
            color: var(--ink-tertiary);
        }
        footer.site-footer nav {
            margin-bottom: 12px;
            display: flex;
            gap: 18px;
            justify-content: center;
            flex-wrap: wrap;
        }
        footer.site-footer a {
            color: var(--warm-brown);
            text-decoration: none;
        }
        footer.site-footer a:hover { text-decoration: underline; }
        @media (max-width: 600px) {
            .container { padding: 32px 16px 60px; }
            article { padding: 28px 22px; border-radius: 18px; }
            article h1 { font-size: 30px; }
            article h2 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="site-header">
            <a href="{{ site.baseurl }}/">
                <svg class="logo" viewBox="-50 -50 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="Kcal-Kun Maskottchen">
                    <!-- Mascot: mood=happy, tone=cream (aus Claude-Design extrahiert) -->
                    <ellipse cx="0" cy="32" rx="28" ry="3" fill="#3A2E1F" opacity="0.12"/>
                    <path d="M-32 8 Q-36 -30 0 -32 Q36 -30 32 8 Q34 30 0 30 Q-34 30 -32 8 Z" fill="#F5EBD6"/>
                    <path d="M-30 12 Q-32 22 -10 26 Q15 28 30 22 Q34 18 32 8 Q28 18 0 20 Q-25 20 -30 12 Z" fill="#E5D7B8" opacity="0.55"/>
                    <ellipse cx="-12" cy="28" rx="6" ry="3" fill="#E5D7B8"/>
                    <ellipse cx="12" cy="28" rx="6" ry="3" fill="#E5D7B8"/>
                    <ellipse cx="-8" cy="0" rx="1.8" ry="2.2" fill="#3A2E1F"/>
                    <ellipse cx="8" cy="0" rx="1.8" ry="2.2" fill="#3A2E1F"/>
                    <circle cx="-14" cy="6" r="2.5" fill="#E8A484" opacity="0.45"/>
                    <circle cx="14" cy="6" r="2.5" fill="#E8A484" opacity="0.45"/>
                    <path d="M-3 4 q3 3 6 0" stroke="#3A2E1F" stroke-width="1.4" fill="none" stroke-linecap="round"/>
                    <path d="M0 -32 Q-3 -38 -7 -36 Q-3 -33 0 -32" fill="#5C8F4F"/>
                    <path d="M0 -32 Q3 -38 7 -36 Q3 -33 0 -32" fill="#6FA258"/>
                </svg>
                <div class="brand">Kcal-Kun</div>
            </a>
        </header>

        <article>
            {{ content }}
        </article>

        <footer class="site-footer">
            <nav>
                <a href="{{ site.baseurl }}/legal/privacy.html">Datenschutz</a>
                <a href="{{ site.baseurl }}/legal/imprint.html">Impressum</a>
                <a href="{{ site.baseurl }}/legal/terms.html">AGB</a>
            </nav>
            <div>© Martin Schulz · Gemacht mit ❤ in der Schweiz</div>
        </footer>
    </div>
</body>
</html>
